
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suporte Técnico</title>
</head>
<body>

    <form
        action="https://httpbin.org/post"
        method="POST"
        enctype="multipart/form-data">

        <fieldset>
            <legend>Abrir Chamado Técnico</legend>

            <p>
                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required>
            </p>

            <p>
                <label for="email">E-mail:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required>
            </p>

            <p>
                <label for="prioridade">Prioridade:</label>
                <select
                    id="prioridade"
                    name="prioridade"
                    required>
                    <option value="">Selecione</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>
            </p>

            <p>
                <label for="anexo">Anexar print ou log:</label>
                <input
                    type="file"
                    id="anexo"
                    name="anexo"
                    accept="image/png,application/pdf"
                    aria-describedby="instrucoes-anexo"
                    required>

                <small id="instrucoes-anexo">
                    Envie somente arquivos PNG ou PDF.
                </small>
            </p>

            <button type="submit">Enviar Chamado</button>

        </fieldset>

    </form>

</body>
</html>
